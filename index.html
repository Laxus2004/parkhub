<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkHub — Sign In</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>

      <!-- ============ Sign in ============ -->
      <div class="auth-card" id="login-screen">
        <div class="auth-brand">
          <div class="auth-logo">
            <div class="mark">P</div>
            <span class="name">ParkHub</span>
          </div>
          <div>
            <h2 class="auth-headline">Smart Parking Management</h2>
          </div>
        </div>

        <div class="auth-form">
          <div class="auth-logo auth-mobile-brand" style="margin-bottom: 40px">
            <div class="mark">P</div>
            <span class="name">ParkHub</span>
          </div>
          <h1 class="auth-title">Sign In</h1>

          <div class="msg msg--success" id="registered-msg" style="margin-top: 16px" hidden></div>

          <form id="login-form" class="stack-sm" style="margin-top: 24px" novalidate>
            <label class="field">
              <span class="field-label">Username</span>
              <input class="input round mono" id="login-username" placeholder="Username" autocomplete="username" autofocus />
            </label>
            <label class="field">
              <span class="field-label">Password</span>
              <span class="input-wrap" style="display: block">
                <input
                  class="input round mono"
                  id="login-password"
                  type="password"
                  placeholder="Enter password"
                  autocomplete="current-password"
                />
                <button type="button" class="input-toggle" data-toggle-pw="login-password">show</button>
              </span>
            </label>
            <div class="msg msg--error" id="login-error" hidden></div>
            <button type="submit" class="btn btn-primary btn-block btn-round" id="login-submit" disabled>Sign In</button>
          </form>

          <p class="auth-alt">New driver? <button type="button" id="go-register">Create an account</button></p>

        </div>
      </div>

      <!-- ============ Register ============ -->
      <div class="register-card" id="register-screen" hidden>
        <div class="register-section" style="padding-top: 24px">
          <div>
            <button type="button" class="link-btn plain" id="back-to-login">← Back to Sign In</button>
            <h1 class="auth-title" style="margin-top: 12px; font-size: 20px">Create Driver Account</h1>
            <p class="mono muted" style="margin-top: 4px; font-size: 11px">Community Parking · Cebu City</p>
          </div>
        </div>

        <form id="register-form" novalidate>
          <div class="register-section">
            <div class="section-label">1 — Personal Information</div>
            <div class="grid-2">
              <label class="field">
                <span class="field-label">First Name</span>
                <input class="input round" id="reg-first" placeholder="e.g. Juan" required />
              </label>
              <label class="field">
                <span class="field-label">Last Name</span>
                <input class="input round" id="reg-last" placeholder="e.g. Dela Cruz" required />
              </label>
            </div>
            <label class="field">
              <span class="field-label">Username</span>
              <span class="field-hint" style="display: block; margin: -2px 0 6px">Used to log in to your account</span>
              <input class="input round mono" id="reg-username" placeholder="e.g. juandelacruz" autocomplete="username" required />
            </label>
            <label class="field">
              <span class="field-label">Contact Number</span>
              <input class="input round mono" id="reg-contact" placeholder="e.g. 09XX XXX XXXX" required />
            </label>
            <label class="field">
              <span class="field-label">Email Address</span>
              <input class="input round mono" id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required />
            </label>
          </div>

          <div class="register-section">
            <div class="section-label">2 — Security</div>
            <label class="field">
              <span class="field-label">Password</span>
              <span class="input-wrap" style="display: block">
                <input
                  class="input round mono"
                  id="reg-password"
                  type="password"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
                <button type="button" class="input-toggle" data-toggle-pw="reg-password">show</button>
              </span>
              <ul class="pw-rules" id="pw-rules" hidden></ul>
            </label>
            <label class="field">
              <span class="field-label">Confirm Password</span>
              <span class="input-wrap" style="display: block">
                <input
                  class="input round mono"
                  id="reg-confirm"
                  type="password"
                  placeholder="Re-enter password"
                  autocomplete="new-password"
                  required
                />
                <button type="button" class="input-toggle" data-toggle-pw="reg-confirm">show</button>
              </span>
              <p class="field-hint" id="pw-match" hidden></p>
            </label>

            <div class="msg msg--error" id="register-error" hidden></div>

            <button type="submit" class="btn btn-dark btn-block btn-round" id="register-submit" disabled>Create Account</button>

            <p class="auth-alt" style="margin-top: 0; font-size: 11px">
              Already have an account? <button type="button" id="back-to-login-2">Sign in</button>
            </p>
          </div>
        </form>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>

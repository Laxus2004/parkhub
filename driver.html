<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkHub — Driver Panel</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="app">
    <!-- ============ Sidebar ============ -->
    <nav class="sidebar" aria-label="Driver navigation">
      <div class="sidebar-brand">
        <span class="brand-mark">P</span>
        <span>
          <span class="brand-name">ParkHub</span>
          <span class="brand-sub">User Portal</span>
        </span>
      </div>
      <ul class="nav-list">
        <li>
          <button class="nav-item is-active" data-nav="dashboard">
            <span class="nav-item-main"><span class="nav-icon">D</span><span class="nav-label">Dashboard</span></span>
          </button>
        </li>
        <li>
          <button class="nav-item" data-nav="profile">
            <span class="nav-item-main">
              <span class="nav-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                </svg>
              </span>
              <span class="nav-label">My Profile</span>
            </span>
          </button>
        </li>
        <li>
          <button class="nav-item" data-nav="notif">
            <span class="nav-item-main">
              <span class="nav-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M8 1.5A4.5 4.5 0 0 0 3.5 6v2.5L2 10h12l-1.5-1.5V6A4.5 4.5 0 0 0 8 1.5Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" />
                  <path d="M6.5 10.5a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.25" />
                </svg>
              </span>
              <span class="nav-label">Notifications</span>
            </span>
            <span class="nav-badge nav-badge--light" id="badge-notif" hidden></span>
          </button>
        </li>
        <li>
          <button class="nav-item" data-nav="parking">
            <span class="nav-item-main">
              <span class="nav-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="1" />
                  <path d="M9 17V9h4a3 3 0 0 1 0 6H9" />
                </svg>
              </span>
              <span class="nav-label">My Parking</span>
            </span>
            <span class="nav-badge nav-badge--light" id="badge-parking" hidden></span>
          </button>
        </li>
        <li>
          <button class="nav-item" data-nav="ticket">
            <span class="nav-item-main">
              <span class="nav-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="5" width="20" height="14" rx="1" />
                  <line x1="2" y1="10" x2="22" y2="10" />
                </svg>
              </span>
              <span class="nav-label">My Ticket</span>
            </span>
            <span class="nav-badge nav-badge--light" id="badge-ticket" hidden></span>
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn-logout" data-logout>Log out</button>
      </div>
    </nav>

    <!-- ============ Header ============ -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menu-toggle" aria-label="Show navigation" title="Show navigation">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title">Driver Panel</div>
      </div>
      <div class="user-chip">
        <div class="avatar" id="user-avatar">D</div>
        <span class="user-name" id="user-name">Driver</span>
      </div>
    </header>

    <!-- ============ Workspace ============ -->
    <main class="workspace">
      <!-- Dashboard -->
      <section data-view="dashboard">
        <div class="container-narrow">
          <div class="page-head">
            <h1 class="page-title">User Dashboard</h1>
            <p class="page-sub" id="welcome-sub"></p>
          </div>
          <div class="kpi-grid cols-3" id="dash-stats" style="margin-bottom: 32px"></div>
          <div class="driver-grid">
            <div id="facility-list"></div>
            <aside class="driver-aside stack">
              <div id="facility-detail"></div>
            </aside>
          </div>
        </div>
      </section>

      <!-- My Profile -->
      <section data-view="profile" hidden>
        <div class="page-narrow stack">
          <h1 class="page-title centered">My Profile</h1>

          <div class="profile-avatar-box">
            <button type="button" class="profile-avatar" id="photo-button" title="Change profile photo">
              <span id="photo-preview">D</span>
              <span class="overlay">Change</span>
            </button>
            <input type="file" id="photo-input" accept="image/*" hidden />
          </div>

          <form class="card" id="details-form">
            <div class="card-head" style="padding: 10px 16px"><span class="card-subhead" style="font-size: 10px">Personal Details</span></div>
            <div class="form-grid">
              <label class="field span-2">
                <span class="field-label sm">Full Name</span>
                <input class="input round-sm" id="profile-name" required />
              </label>
              <label class="field">
                <span class="field-label sm">Email Address</span>
                <input class="input round-sm mono" id="profile-email" type="email" required />
              </label>
              <label class="field">
                <span class="field-label sm">Contact Number</span>
                <input class="input round-sm mono" id="profile-contact" required />
              </label>
            </div>
            <p class="msg" id="details-msg" style="margin: 0 16px 16px" hidden></p>
            <div class="card-foot"><button type="submit" class="btn-rounded dark">Save Changes</button></div>
          </form>

          <form class="card" id="password-form">
            <div class="card-head" style="padding: 10px 16px"><span class="card-subhead" style="font-size: 10px">Change Password</span></div>
            <div class="form-grid">
              <label class="field span-2">
                <span class="field-label sm">Current Password</span>
                <input class="input round-sm mono" id="pw-current" type="password" autocomplete="current-password" required />
              </label>
              <label class="field">
                <span class="field-label sm">New Password</span>
                <input class="input round-sm mono" id="pw-new" type="password" autocomplete="new-password" required />
              </label>
              <label class="field">
                <span class="field-label sm">Confirm New Password</span>
                <input class="input round-sm mono" id="pw-confirm" type="password" autocomplete="new-password" required />
              </label>
              <p class="field-hint span-2" style="margin: 0">Use 8 or more characters with an uppercase letter, number, and special character.</p>
            </div>
            <p class="msg" id="password-msg" style="margin: 0 16px 16px" hidden></p>
            <div class="card-foot"><button type="submit" class="btn-rounded red">Update Password</button></div>
          </form>
        </div>
      </section>

      <!-- Notifications -->
      <section data-view="notif" hidden>
        <div class="page-wide stack">
          <h1 class="page-title centered">Notifications</h1>
          <div class="card" id="notif-list"></div>
        </div>
      </section>

      <!-- My Parking -->
      <section data-view="parking" hidden>
        <div class="page-wide stack">
          <h1 class="page-title centered">My Parking</h1>
          <div class="card">
            <div class="card-head" style="padding: 10px 16px"><span class="card-subhead" style="font-size: 10px">Parking Activity</span></div>
            <div class="activity-grid" id="parking-activity"></div>
          </div>
          <div id="parking-sessions"></div>
        </div>
      </section>

      <!-- My Ticket -->
      <section data-view="ticket" hidden>
        <div class="page-medium stack">
          <h1 class="page-title centered">My Ticket</h1>
          <div id="ticket-content" class="stack"></div>
        </div>
      </section>
    </main>

    <!-- Modals are rendered here (reserve, extend, cancel confirmation) -->
    <div id="modal-root"></div>

    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/driver.js"></script>
  </body>
</html>
